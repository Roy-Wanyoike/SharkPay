server:
  port: 8082

spring:
  application:
    name: sharkpay-wallet
  jackson:
    # optional fields (reason, from_status, closed_at) must be omitted, not
    # null — the event schemas use additionalProperties: false + typed fields
    default-property-inclusion: non_null
  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5432/sharkpay_wallet}
    username: ${WALLET_DB_USER:sharkpay_wallet}
    password: ${WALLET_DB_PASSWORD:sharkpay_wallet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuing service tokens (ADR 001 stack lock).
          issuer-uri: ${WALLET_ISSUER_URI:http://localhost:8080/realms/sharkpay}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
