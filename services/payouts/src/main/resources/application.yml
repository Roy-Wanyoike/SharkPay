server:
  port: 8087

spring:
  application:
    name: sharkpay-payouts
  jackson:
    # optional fields (entry_id, failure_reason, return_reason, provider_ref,
    # metadata, expires_at, reason, ...) must be omitted, not null — the
    # schemas use additionalProperties: false + typed fields
    default-property-inclusion: non_null
  datasource:
    # shared sharkpay DB, schema pinned via the provisioned role's
    # search_path (infrastructure/dev/postgres/init/01-schemas.sql creates
    # role sharkpay_payouts + schema payouts)
    url: ${PAYOUTS_DB_URL:jdbc:postgresql://localhost:5432/sharkpay?currentSchema=payouts}
    username: ${PAYOUTS_DB_USER:sharkpay_payouts}
    password: ${PAYOUTS_DB_PASSWORD:sharkpay_payouts}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuing service tokens (ADR 001 stack lock).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sharkpay}

# Temporal workflow orchestration (per ADR 001/002) — the durable workflow
# layer is NOT wired in this wave; the seam is documented here so the
# integrator can lift the plain state machines + SchedulerPort into
# workflows without touching the domain (see config/LoggingSchedulerPort).
temporal:
  address: ${TEMPORAL_ADDRESS:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:sharkpay-payouts}

payouts:
  fees:
    # flat component (minor units, charged in the payout currency) and a
    # per-myriad (bps) component of the payout amount, per rail. The flat
    # component is the non-refundable portion retained on RETURNED.
    mpesa-flat-minor: 5500
    mpesa-bps: 100
    bank-flat-minor: 3000
    bank-bps: 50
    on-chain-flat-minor: 250000
    on-chain-bps: 25
  release:
    # clock-driven batch release: payouts with execute_after <= now are
    # released in batches of at most batch-size per tick
    batch-size: 50
    # bounded exponential backoff for provider submission retries:
    # base * 2^attempts + jitter, capped at max-backoff-ms
    max-attempts: 8
    backoff-base-ms: 1000
    backoff-cap-ms: 300000
    backoff-jitter-ms: 250
  poll:
    # in-flight provider status polling batch (PROCESSING/SENT payouts)
    batch-size: 100
  expiry:
    # TTL sweep batch (PENDING_RISK/PROCESSING payouts past expires_at)
    batch-size: 100
  scheduler:
    # one tick = release due batch + TTL sweep + in-flight poll
    tick-interval-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
