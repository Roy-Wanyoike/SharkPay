server:
  port: 8084

spring:
  application:
    name: sharkpay-risk
  datasource:
    url: ${RISK_DB_URL:jdbc:postgresql://localhost:5432/sharkpay_risk}
    username: ${RISK_DB_USER:risk}
    password: ${RISK_DB_PASSWORD:risk}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates its mappings.
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuing internal service tokens (Wave 2 identity).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sharkpay}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
