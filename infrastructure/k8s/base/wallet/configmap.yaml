# Mirrors services/wallet/src/main/resources/application.yml (dev defaults)
# with localhost hosts swapped for in-cluster DNS. Spring Boot picks this up
# from /app/config/application.yml (mounted below); ${ENV:default} overrides
# stay live so Secrets injected as env vars win.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config
  labels:
    app.kubernetes.io/name: wallet
    app.kubernetes.io/part-of: sharkpay
data:
  application.yml: |
    server:
      port: 8082
    
    spring:
      application:
        name: sharkpay-wallet
      jackson:
        # Optional fields must be omitted, not null — the event schemas use
        # additionalProperties: false + typed fields (see service application.yml).
        default-property-inclusion: non_null
      datasource:
        url: ${WALLET_DB_URL:jdbc:postgresql://postgres.sharkpay-postgres.svc:5432/sharkpay_wallet}
        username: ${WALLET_DB_USER:sharkpay_wallet}
        password: ${WALLET_DB_PASSWORD:sharkpay_wallet}
      jpa:
        hibernate:
          ddl-auto: validate
        open-in-view: false
      flyway:
        enabled: true
        locations: classpath:db/migration
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: ${WALLET_ISSUER_URI:http://keycloak.sharkpay-keycloak.svc:8080/realms/sharkpay}
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info
      endpoint:
        health:
          probes:
            enabled: true
