# Mirrors services/risk/src/main/resources/application.yml (dev defaults)
# with localhost hosts swapped for in-cluster DNS. Spring Boot picks this up
# from /app/config/application.yml (mounted below); ${ENV:default} overrides
# stay live so Secrets injected as env vars win.
apiVersion: v1
kind: ConfigMap
metadata:
  name: risk-config
  labels:
    app.kubernetes.io/name: risk
    app.kubernetes.io/part-of: sharkpay
data:
  application.yml: |
    server:
      port: 8084
    
    spring:
      application:
        name: sharkpay-risk
      datasource:
        url: ${RISK_DB_URL:jdbc:postgresql://postgres.sharkpay-postgres.svc:5432/sharkpay_risk}
        username: ${RISK_DB_USER:risk}
        password: ${RISK_DB_PASSWORD:risk}
      flyway:
        enabled: true
        locations: classpath:db/migration
      jpa:
        hibernate:
          # Schema is owned by Flyway; Hibernate only validates its mappings.
          ddl-auto: validate
        open-in-view: false
      security:
        oauth2:
          resourceserver:
            jwt:
              # Keycloak realm issuing internal service tokens (Wave 2 identity).
              issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.sharkpay-keycloak.svc:8080/realms/sharkpay}
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info
      endpoint:
        health:
          probes:
            enabled: true
