apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fx
  labels:
    app.kubernetes.io/name: fx
    app.kubernetes.io/part-of: sharkpay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fx
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      # HPA is the "resource relief" knob of ADR 002 s3 — scale down gently.
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
