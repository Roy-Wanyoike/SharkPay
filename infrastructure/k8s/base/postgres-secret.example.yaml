# EXAMPLE ONLY — DO NOT APPLY, DO NOT FILL WITH REAL VALUES IN GIT.
#
# This shows the k8s Secret shape for the ledger service (the money-path
# Go service, DATABASE_URL DSN form). The live Secret is created out of band
# and is never committed to the repository:
#
#   cp base/secrets/ledger.env.example /secure/ledger.env   # fill real values
#   kubectl -n sharkpay create secret generic ledger-secrets \
#     --from-env-file=/secure/ledger.env
#
# Equivalent YAML shape (for GitOps with sealed-secrets / external-secrets
# / SOPS-encrypted overlays):
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  labels:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/part-of: sharkpay
type: Opaque
stringData:
  # Placeholder values — the real DSN points at the sharkpay-postgres
  # namespace with per-env credentials and sslmode=require.
  DATABASE_URL: "postgres://REPLACE_USER:REPLACE_PASSWORD@postgres.sharkpay-postgres.svc:5432/sharkpay?sslmode=require"
  INTERNAL_API_TOKEN: "REPLACE_ME"
