# Allow any pod in the namespace to talk to any other pod in the namespace
# (api-gateway -> identity/wallet/payments REST calls, internal consumers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
