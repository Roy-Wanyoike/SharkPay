# Prometheus (namespace: monitoring) must scrape the workload pods — without
# this policy the default-deny blocks scraping and the canary AnalysisRuns
# (base/rollouts/analysis-templates.yaml) starve of data.
# Port range covers every service's HTTP port: 8080 (api-gateway),
# 8081-8087 (identity..reconciliation), 8090 (ledger), 8091 (providers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8080
      endPort: 8091
