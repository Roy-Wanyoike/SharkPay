# payments — money-path service (ADR 002): Argo Rollouts canary with
# SLO-gated promotion (analysis templates in base/rollouts/).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: sharkpay
    app.kubernetes.io/component: backend
    sharkpay.io/runtime: java
    sharkpay.io/tier: money-critical
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
      # ADR 002 s3: a bad deploy must never take the whole backend at once.
      - setWeight: 10
      - pause:
          duration: 2m
      - setWeight: 25
      - pause:
          duration: 5m
      - setWeight: 50
      - analysis:
          templates:
          - templateName: api-success-rate
          - templateName: api-p99-latency
          args:
          - name: service
            value: payments
      - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        app.kubernetes.io/part-of: sharkpay
        app.kubernetes.io/component: backend
    spec:
      # ADR 001/002 hardening: non-root, locked-down, read-only root fs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Active-active across >= 2 AZs (ADR 002 s3); prod overlay makes this
      # strict (whenUnsatisfiable: DoNotSchedule).
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: payments
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: payments
      containers:
      - name: payments
        image: ghcr.io/roy-wanyoike/sharkpay-payments:PLACEHOLDER
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8085
          protocol: TCP
        env:
        - name: PAYMENTS_DB_URL
          valueFrom:
            secretKeyRef:
              name: payments-secrets
              key: PAYMENTS_DB_URL
        - name: PAYMENTS_DB_USER
          valueFrom:
            secretKeyRef:
              name: payments-secrets
              key: PAYMENTS_DB_USER
        - name: PAYMENTS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payments-secrets
              key: PAYMENTS_DB_PASSWORD
        volumeMounts:
        - name: config
          mountPath: /app/config/application.yml
          subPath: application.yml
          readOnly: true
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: payments-config
      - name: tmp
        emptyDir: {}

