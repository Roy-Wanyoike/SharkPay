# Mirrors services/payments/src/main/resources/application.yml (dev defaults)
# with localhost hosts swapped for in-cluster DNS. Spring Boot picks this up
# from /app/config/application.yml (mounted below); ${ENV:default} overrides
# stay live so Secrets injected as env vars win.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: sharkpay
data:
  application.yml: |
    server:
      port: 8085
    
    spring:
      application:
        name: sharkpay-payments
      datasource:
        url: ${PAYMENTS_DB_URL:jdbc:postgresql://postgres.sharkpay-postgres.svc:5432/sharkpay_payments}
        username: ${PAYMENTS_DB_USER:sharkpay_payments}
        password: ${PAYMENTS_DB_PASSWORD:sharkpay_payments}
      jpa:
        hibernate:
          ddl-auto: validate
        open-in-view: false
      flyway:
        enabled: true
        locations: classpath:db/migration
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.sharkpay-keycloak.svc:8080/realms/sharkpay}
    
    # Temporal workflow orchestration (Java SDK, per ADR 001/002).
    temporal:
      address: ${TEMPORAL_ADDRESS:temporal.sharkpay-temporal.svc:7233}
      namespace: ${TEMPORAL_NAMESPACE:sharkpay-payments}
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info
      endpoint:
        health:
          probes:
            enabled: true
