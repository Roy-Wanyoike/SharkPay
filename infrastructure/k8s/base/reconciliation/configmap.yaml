# Mirrors services/reconciliation/src/main/resources/application.yml (dev defaults)
# with localhost hosts swapped for in-cluster DNS. Spring Boot picks this up
# from /app/config/application.yml (mounted below); ${ENV:default} overrides
# stay live so Secrets injected as env vars win.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reconciliation-config
  labels:
    app.kubernetes.io/name: reconciliation
    app.kubernetes.io/part-of: sharkpay
data:
  application.yml: |
    server:
      port: 8087
    
    spring:
      application:
        name: sharkpay-reconciliation
      datasource:
        url: ${RECON_DB_URL:jdbc:postgresql://postgres.sharkpay-postgres.svc:5432/sharkpay_recon}
        username: ${RECON_DB_USER:sharkpay_recon}
        password: ${RECON_DB_PASSWORD:sharkpay_recon}
      jpa:
        hibernate:
          ddl-auto: validate
        open-in-view: false
      flyway:
        enabled: true
        locations: classpath:db/migration
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.sharkpay-keycloak.svc:8080/realms/sharkpay}
    
    # CloudEvents transport (NATS JetStream, per ADR 001).
    nats:
      url: ${NATS_URL:nats://nats.sharkpay-nats.svc:4222}
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info
      endpoint:
        health:
          probes:
            enabled: true
