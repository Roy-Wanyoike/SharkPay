# nats-server.conf — SharkPay dev broker (ADR 001: NATS 2.x JetStream is the
# CloudEvents transport; Redpanda was removed from the dev stack).
#
#   image:  nats:2.11-alpine
#   mount:  docker-compose.yml → volumes: ./infrastructure/dev/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
#           plus named volume nats_data:/data (JetStream file store)
#
# Syntax check (any machine with the binary, no server start):
#   nats-server -t -c infrastructure/dev/nats/nats-server.conf

# Client port. Services connect with NATS_URL=nats://nats:4222.
listen: "0.0.0.0:4222"

# HTTP monitoring endpoint (healthcheck target, http://localhost:8222/).
http: "0.0.0.0:8222"

# Single-node dev identity (shows up in monitoring / nats-box).
server_name: "sharkpay-dev-nats"

# Dev-only: NO authentication. Never expose this port outside the compose
# network. For shared environments add a users/permissions block (see
# https://docs.nats.io/running-a-nats-service/configuration/securing/nats_auth/users).

jetstream {
    # File-based persistence inside the nats_data volume (survives restarts,
    # reset with `docker compose down -v`).
    store_dir: "/data"

    # Memory-store cap: limits how much JetStream may hold in RAM before
    # spilling to the file store (512 MiB of dev headroom).
    max_memory: 536870912

    # Total file-store cap for all streams (10 GiB dev).
    max_file: 10737418240
}

# Streams themselves are runtime objects (created via the NATS API / nats-box
# CLI, not by this config file). The topic catalog that streams subscribe to
# lives in contracts/events/events.md; see docs/DEV-STACK.md
# § "Creating JetStream streams" for the bootstrap commands.
